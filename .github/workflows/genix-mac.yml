name: Genix Destek - Mac derleme

# Genixsoft: musteri surumu (yalniz baglanilir) Mac icin.
# MACOS_P12_BASE64 + NOTARY_* secret'lari varsa Developer ID ile imzalanir ve Apple'a onaylatilir
# (notarize + staple) -> Mac uyari vermeden acar. Yoksa ad-hoc imzaya duser ("Yine de Ac" gerekir).
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  GENIX_ROL: "musteri"
  SCITER_RUST_VERSION: "1.75" # https://github.com/rustdesk/rustdesk/discussions/7503, also 1.78 has ABI change which causes our sciter version not working, https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  RUST_VERSION: "1.75" # sciter failed on m1 with 1.78 because of https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  MAC_RUST_VERSION: "1.81" # 1.81 is requred for macos, because of https://github.com/yury/cidre requires 1.81
  CARGO_NDK_VERSION: "3.1.2"
  SCITER_ARMV7_CMAKE_VERSION: "3.29.7"
  SCITER_NASM_DEBVERSION: "2.15.05-1"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  # Windows arm64 only: the first stable Flutter to ship a native arm64 Windows Dart SDK +
  # engine is 3.44. Every other platform stays on FLUTTER_VERSION (3.24.5) until Windows 7
  # support is restored after the upstream-wide Flutter bump. The arm64 job patches the few
  # 3.44-only source/pubspec changes on the fly (see "Patch RustDesk sources for Flutter 3.44").
  FLUTTER_WINDOWS_ARM_VERSION: "3.44.9"
  # for arm64 linux because official Dart SDK does not work
  FLUTTER_ELINUX_VERSION: "3.16.9"
  TAG_NAME: "genix-destek"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  # vcpkg version: 2026.07.29
  # If we change the `VCPKG COMMIT_ID`, please remember:
  # 1. Call `$VCPKG_ROOT/vcpkg x-update-baseline` to update the baseline in `vcpkg.json`.
  #  Or we may face build issue like 
  #  https://github.com/rustdesk/rustdesk/actions/runs/14414119794/job/40427970174
  # 2. Update the `VCPKG_COMMIT_ID` in `ci.yml` and `playground.yml`.
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_CMAKE_VERSION: "4.3.0"
  ARMV7_VCPKG_COMMIT_ID: "6f29f12e82a8293156836ad81cc9bf5af41fe836" # 2025.01.13, got "/opt/artifacts/vcpkg/vcpkg: No such file or directory" with latest version
  VERSION: "1.5.0"
  NDK_VERSION: "r28c"
  #signing keys env variable checks
  ANDROID_SIGNING_KEY: "${{ secrets.ANDROID_SIGNING_KEY }}"
  MACOS_P12_BASE64: "${{ secrets.MACOS_P12_BASE64 }}"
  MACOS_P12_PASSWORD: "${{ secrets.MACOS_P12_PASSWORD }}"
  NOTARY_KEY_P8_BASE64: "${{ secrets.NOTARY_KEY_P8_BASE64 }}"
  NOTARY_KEY_ID: "${{ secrets.NOTARY_KEY_ID }}"
  NOTARY_ISSUER_ID: "${{ secrets.NOTARY_ISSUER_ID }}"
  UPLOAD_ARTIFACT: "true"
  SIGN_BASE_URL: "${{ secrets.SIGN_BASE_URL }}-2"
jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-for-macOS:
    name: ${{ matrix.job.target }}
    runs-on: ${{ matrix.job.os }}
    needs: [generate-bridge]
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              target: x86_64-apple-darwin,
              os: macos-15-intel, #macos-latest or macos-14 use M1 now, https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners/about-github-hosted-runners#:~:text=14%20GB-,macos%2Dlatest%20or%20macos%2D14,-The%20macos%2Dlatestlabel
              extra-build-args: "",
              arch: x86_64,
              vcpkg-triplet: x64-osx,
            }
          - {
              target: aarch64-apple-darwin,
              os: macos-14,
              # extra-build-args: "--disable-flutter-texture-render", # disable this for mac, because we see a lot of users reporting flickering both on arm and x64, and we can not confirm if texture rendering has better performance if htere is no vram, https://github.com/rustdesk/rustdesk/issues/6296
              extra-build-args: "--screencapturekit",
              arch: aarch64,
              vcpkg-triplet: arm64-osx,
            }
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install build runtime
        run: |
          brew install llvm create-dmg
          # pkg-config is handled in a separate step, because it may be already installed by `macos-latest`(14.7.1) runner
          if command -v pkg-config &>/dev/null; then
              echo "pkg-config is already installed"
          else
              brew install pkg-config
          fi

      - name: Install NASM
        run: |
          # Install NASM 2.16.x from official release.
          # Do NOT use `brew install nasm` which installs NASM 3.x.
          # NASM 3.x is a complete rewrite with incompatible CLI options and removed features.
          # aom and other multimedia libraries require NASM 2.x for x86/x86_64 assembly.
          wget https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip nasm-2.16.03-macosx.zip
          sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
          nasm --version

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
            git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Workaround for flutter issue
        shell: bash
        run: |
          cd "$(dirname "$(which flutter)")"
          # https://github.com/flutter/flutter/issues/133533
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' ../packages/flutter/lib/src/scheduler/binding.dart
          grep -n '_setFramesEnabledState(false);' ../packages/flutter/lib/src/scheduler/binding.dart

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: ${{ matrix.job.os }}

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log" || true

      - name: Show version information (Rust, cargo, Clang)
        shell: bash
        run: |
          clang --version || true
          rustup -V
          rustup toolchain list
          rustup default
          cargo -V
          rustc -V

      - name: Build rustdesk
        run: |
          if [ "${{ matrix.job.target }}" = "aarch64-apple-darwin" ]; then
            MIN_MACOS_VERSION="12.3"
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
            sed -i -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
            sed -i -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj
          fi
          ./build.py --flutter --hwcodec --unix-file-copy-paste ${{ matrix.job.extra-build-args }}

      - name: Genix Destek olarak adlandir ve imzala
        run: |
          set -e
          cd ./flutter/build/macos/Build/Products/Release
          APP="Genix Destek.app"
          rm -rf "$APP"
          mv RustDesk.app "$APP"
          mv "$APP/Contents/MacOS/RustDesk" "$APP/Contents/MacOS/Genix Destek"
          P="$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable Genix Destek" "$P"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName Genix Destek" "$P"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleDisplayName" "$P" || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Genix Destek" "$P"
          if [ -n "$MACOS_P12_BASE64" ]; then
            KC="$RUNNER_TEMP/genix.keychain-db"; KCP="$(uuidgen)"
            echo "$MACOS_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/genix.p12"
            security create-keychain -p "$KCP" "$KC"
            security set-keychain-settings -lut 21600 "$KC"
            security unlock-keychain -p "$KCP" "$KC"
            security import "$RUNNER_TEMP/genix.p12" -P "$MACOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
            security set-key-partition-list -S apple-tool:,apple: -k "$KCP" "$KC" >/dev/null
            security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
            rm -f "$RUNNER_TEMP/genix.p12"
            ID="Developer ID Application: OKAY AYDIN (3NQBF82PXT)"
            # once icerideki tum parcalar, sonra ana uygulama yetkileriyle (hardened runtime + zaman damgasi)
            codesign --force --deep --options runtime --timestamp -s "$ID" "$APP"
            codesign --force --options runtime --timestamp --entitlements "${GITHUB_WORKSPACE}/flutter/macos/Runner/Release.entitlements" -s "$ID" "$APP"
            codesign --verify --deep --strict --verbose=2 "$APP"
            echo "GENIX_IMZA=devid" >> "$GITHUB_ENV"
          else
            codesign --force --deep -s - "$APP"
            codesign --verify --deep --verbose=2 "$APP"
            echo "GENIX_IMZA=adhoc" >> "$GITHUB_ENV"
          fi
          ls "$APP/Contents/MacOS"

      - name: DMG olustur ve imzala
        run: |
          CREATE_DMG="$(command -v create-dmg)"
          CREATE_DMG="$(readlink -f "$CREATE_DMG")"
          sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
          create-dmg --volname "Genix Destek" --icon "Genix Destek.app" 200 190 --hide-extension "Genix Destek.app" --window-size 800 400 --app-drop-link 600 185 "GenixDestek-mac-${{ matrix.job.arch }}.dmg" "./flutter/build/macos/Build/Products/Release/Genix Destek.app"
          if [ "$GENIX_IMZA" = "devid" ]; then
            codesign --force --timestamp -s "Developer ID Application: OKAY AYDIN (3NQBF82PXT)" "GenixDestek-mac-${{ matrix.job.arch }}.dmg"
          fi
          shasum -a 256 GenixDestek-mac-*.dmg

      # Apple onayi gecikse bile imzali dmg kaybolmasin: once kaydet
      - name: Upload dmg (imzali)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: GenixDestek-mac-${{ matrix.job.arch }}-imzali
          path: GenixDestek-mac-${{ matrix.job.arch }}.dmg

      - name: Apple onayi (notarize + staple)
        if: env.GENIX_IMZA == 'devid'
        run: |
          DMG="GenixDestek-mac-${{ matrix.job.arch }}.dmg"
          K="$RUNNER_TEMP/notary.p8"
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$K"
          A=(--key "$K" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID")
          SID=$(xcrun notarytool submit "$DMG" "${A[@]}" --output-format json | python3 -c "import json,sys;print(json.load(sys.stdin)['id'])")
          echo "Apple gonderim no: $SID"
          echo "$SID" > "notary-${{ matrix.job.arch }}.txt"
          xcrun notarytool wait "$SID" "${A[@]}" --timeout 45m || true
          ST=$(xcrun notarytool info "$SID" "${A[@]}" --output-format json | python3 -c "import json,sys;print(json.load(sys.stdin)['status'])")
          echo "Apple durumu: $ST"
          if [ "$ST" = "Accepted" ]; then
            xcrun stapler staple "$DMG"
            xcrun stapler validate "$DMG"
            spctl -a -t open --context context:primary-signature -vv "$DMG" || true
          elif [ "$ST" = "In Progress" ]; then
            echo "::warning::Apple onayi hala suruyor ($SID); dmg imzali kaydedildi, onay sonra eklenecek"
          else
            xcrun notarytool log "$SID" "${A[@]}" || true
            exit 1
          fi
          rm -f "$K"

      - name: Upload dmg (son)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: GenixDestek-mac-${{ matrix.job.arch }}
          path: |
            GenixDestek-mac-${{ matrix.job.arch }}.dmg
            notary-${{ matrix.job.arch }}.txt
          if-no-files-found: warn

      - name: Publish Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          prerelease: true
          tag_name: genix-mac-${{ github.run_number }}
          name: Genix Destek Mac ${{ env.VERSION }} (derleme ${{ github.run_number }})
          files: |
            GenixDestek-mac-*.dmg
